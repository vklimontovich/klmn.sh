all:
  children:
    master:
      hosts:
        fatman.klmn.sh:
    workers:
      hosts:
        salmon.greatinet.org:
    home:
      hosts:
        home.klmn.sh:
          k3s_standalone: true
          k3s_standalone_version: "v1.36.5+k3s1"
          k3s_tls_san:
            - home.klmn.sh
            - 192.168.8.234
            - 100.110.211.115
            - fort
          # Behind router NAT; ufw off
          firewall_enabled: false
    enter:
      hosts:
        enter.greatinet.org:
          out_of_tailnet: true
          enabled: true
          manager_user: true
          open_ports:
            - port: "51820"
              proto: udp
              comment: "WireGuard"
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ansible_become: true
    ansible_become_method: sudo
