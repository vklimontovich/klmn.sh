---
# Single-node k3s server, separate from the main cluster
- name: Ensure K3s config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure standalone K3s
  copy:
    content: |
      write-kubeconfig-mode: "0600"
      tls-san:
      {% for san in k3s_tls_san %}
        - {{ san }}
      {% endfor %}
      disable:
        - traefik
        - servicelb
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart K3s

- name: Check if K3s is installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install standalone K3s
  shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION="{{ k3s_standalone_version }}"
    sh -s - server
  when: not k3s_binary.stat.exists
